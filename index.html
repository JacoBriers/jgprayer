<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunday Prayer</title>
<meta name="description" content="Sunday Prayer — every Sunday, 15:30–15:45 (SAST). Add it to your calendar.">
<meta name="theme-color" content="#0077c0">
<meta property="og:title" content="Sunday Prayer">
<meta property="og:description" content="Every Sunday, 15:30–15:45 (SAST). Add it to your calendar.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap">
<style>
  :root {
    --jg-navy: #1d3b64;
    --jg-navy-ink: #0f1b2d;
    --jg-blue: #0077c0;
    --jg-prose: #38506d;
    --jg-prose-muted: #5a6a81;
    --jg-surface-tint: #edf4fb;
    --jg-border-soft: #d6e3ef;
    --jg-white: #fff;
    --radius-pill: 9999px;
    --radius-card: 32px;
    --radius-panel: 24px;
    --shadow-card: 0 12px 40px #0000000f;
    --ease-brand: cubic-bezier(.22, 1, .36, 1);
    --font-body: "Poppins", ui-sans-serif, system-ui, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem 1.25rem;
    background: var(--jg-white);
    color: var(--jg-navy);
    font-family: var(--font-body);
    font-weight: 300;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .card {
    width: 100%;
    max-width: 32rem;
    background: var(--jg-white);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-card);
    padding: 2.75rem 2rem 2.25rem;
    text-align: center;
  }

  .kicker {
    margin: 0 0 .65rem;
    font-size: .72rem;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--jg-blue);
  }

  h1 {
    margin: 0 0 1.75rem;
    font-size: clamp(1.9rem, 7vw, 2.5rem);
    line-height: 1.15;
    font-weight: 600;
    letter-spacing: -.025em;
    color: var(--jg-navy-ink);
  }

  .details {
    margin: 0 0 1.75rem;
    padding: 1.25rem 1rem;
    background: var(--jg-surface-tint);
    border: 1px solid var(--jg-border-soft);
    border-radius: var(--radius-panel);
    display: grid;
    gap: .85rem;
  }
  .details div + div { border-top: 1px solid var(--jg-border-soft); padding-top: .85rem; }
  .details dt {
    margin: 0 0 .15rem;
    font-size: .72rem;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--jg-prose-muted);
  }
  .details dd {
    margin: 0;
    font-size: 1.05rem;
    font-weight: 500;
    color: var(--jg-navy);
  }

  .actions { display: grid; gap: .75rem; }

  .jg-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: .5rem;
    min-height: 48px;
    padding: .875rem 1.75rem;
    border-radius: var(--radius-pill);
    border: 2px solid transparent;
    font-family: inherit;
    font-size: .95rem;
    font-weight: 500;
    text-decoration: none;
    cursor: pointer;
    transition: transform .4s var(--ease-brand),
                background-color .4s var(--ease-brand),
                color .4s var(--ease-brand),
                border-color .4s var(--ease-brand),
                box-shadow .4s var(--ease-brand);
  }

  .jg-button--primary {
    background: var(--jg-blue);
    border-color: var(--jg-blue);
    color: var(--jg-white);
    box-shadow: 0 12px 30px #0077c059;
  }

  .jg-button--secondary {
    background: var(--jg-white);
    border-width: 1px;
    border-color: var(--jg-border-soft);
    color: var(--jg-navy);
  }

  @media (hover: hover) {
    .jg-button:hover { transform: translateY(-2px); }
    .jg-button--secondary:hover { border-color: var(--jg-blue); color: var(--jg-blue); }
  }

  .jg-button:focus-visible {
    outline: 3px solid var(--jg-blue);
    outline-offset: 3px;
  }

  @media (prefers-reduced-motion: reduce) {
    .jg-button { transition: none; }
    .jg-button:hover { transform: none; }
  }

  @media (max-width: 380px) {
    .card { padding: 2rem 1.25rem 1.75rem; }
    .jg-button { padding: .875rem 1rem; }
  }
</style>
</head>
<body>
  <main class="card">
    <p class="kicker">Weekly gathering</p>
    <h1>Sunday Prayer</h1>
    <dl class="details">
      <div>
        <dt>When</dt>
        <dd>Every Sunday</dd>
      </div>
      <div>
        <dt>Time</dt>
        <dd>15:30 &ndash; 15:45 <span aria-hidden="true">&middot;</span> SAST</dd>
      </div>
    </dl>

    <div class="actions">
      <a class="jg-button jg-button--primary" href="sunday-prayer.ics" download>Add to calendar</a>
      <a class="jg-button jg-button--secondary" href="https://calendar.google.com/calendar/render?action=TEMPLATE&amp;text=Sunday+Prayer&amp;dates=20260920T133000Z/20260920T134500Z&amp;recur=RRULE:FREQ%3DWEEKLY;BYDAY%3DSU;UNTIL%3D20271231T235959Z" target="_blank" rel="noopener">Add to Google Calendar</a>
    </div>
  </main>
</body>
</html>
